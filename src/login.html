<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="contact-container">
        <!-- Titre principal -->
        <h1>Nous contacter OLA Energy</h1>

        <!-- Sous-titre -->
        <p class="subtitle">Contactez-nous pour vos questions, vos commentaires ou vos demandes. Notre équipe est prête
            à vous aider.</p>

        <!-- Formulaire de contact -->
        <form action="#" method="POST">

            <!-- Champ Département -->
            <div class="form-group">
                <label for="departement">Département</label>
                <select id="departement" name="departement" required>
                    <option value="" disabled selected>Sélectionner...</option>
                    <option value="service-client">Service Client</option>
                    <option value="commercial">Service Commercial</option>
                    <option value="technique">Support Technique</option>
                </select>
            </div>

            <!-- Champ Nom Complet -->
            <div class="form-group">
                <label for="nom">Nom complet</label>
                <input type="text" id="nom" name="nom" placeholder="Écrivez votre nom" required>
            </div>

            <!-- Champ E-mail -->
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="jane@gmail.com" required>
            </div>

            <!-- Champ Message -->
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Écrivez votre message ici..." required></textarea>
            </div>

            <!-- Case à cocher Conditions Générales -->
            <div class="checkbox-group">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions" class="checkbox-label">J'accepte les conditions générales</label>
            </div>

            <!-- Bouton Envoyer -->
            <button type="submit" class="btn-submit">Envoyer</button>

        </form>
    </div>
